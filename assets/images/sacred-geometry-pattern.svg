<?xml version="1.0" encoding="UTF-8"?>
<svg width="800px" height="800px" viewBox="0 0 800 800" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>Sacred Geometry Pattern</title>
    <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd" opacity="0.15">
        <g transform="translate(400.000000, 400.000000)" stroke="#8B4513" stroke-width="2">
            <!-- Flower of Life Pattern -->
            <circle cx="0" cy="0" r="100"></circle>
            <circle cx="0" cy="-173.2" r="100"></circle>
            <circle cx="150" cy="-86.6" r="100"></circle>
            <circle cx="150" cy="86.6" r="100"></circle>
            <circle cx="0" cy="173.2" r="100"></circle>
            <circle cx="-150" cy="86.6" r="100"></circle>
            <circle cx="-150" cy="-86.6" r="100"></circle>
            
            <!-- Second layer -->
            <circle cx="0" cy="-346.4" r="100"></circle>
            <circle cx="300" cy="-173.2" r="100"></circle>
            <circle cx="300" cy="173.2" r="100"></circle>
            <circle cx="0" cy="346.4" r="100"></circle>
            <circle cx="-300" cy="173.2" r="100"></circle>
            <circle cx="-300" cy="-173.2" r="100"></circle>
            
            <!-- Additional sacred geometry elements -->
            <path d="M0,0 L0,-346.4 M0,0 L300,-173.2 M0,0 L300,173.2 M0,0 L0,346.4 M0,0 L-300,173.2 M0,0 L-300,-173.2" stroke-dasharray="5,5"></path>
            
            <!-- Om symbol in the center -->
            <path d="M0,0 C10,10 20,-10 0,-20 C-20,-30 -30,0 -10,10 C10,20 30,0 20,-20 C10,-40 -20,-30 -30,-10 C-40,10 -20,30 0,20 C20,10 30,-10 20,-30" stroke="#A0522D" stroke-width="3"></path>
        </g>
    </g>
</svg>
