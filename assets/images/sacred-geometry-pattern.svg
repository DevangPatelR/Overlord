<?xml version="1.0" encoding="UTF-8"?>
<svg width="800px" height="800px" viewBox="0 0 800 800" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>Sacred Geometry Pattern</title>
    <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd" opacity="0.1">
        <g transform="translate(400.000000, 400.000000)" stroke="#0A6EB4" stroke-width="1.5">
            <!-- Flower of Life Pattern -->
            <circle cx="0" cy="0" r="100"></circle>
            <circle cx="0" cy="-173.2" r="100"></circle>
            <circle cx="150" cy="-86.6" r="100"></circle>
            <circle cx="150" cy="86.6" r="100"></circle>
            <circle cx="0" cy="173.2" r="100"></circle>
            <circle cx="-150" cy="86.6" r="100"></circle>
            <circle cx="-150" cy="-86.6" r="100"></circle>
            
            <!-- Second layer -->
            <circle cx="0" cy="-346.4" r="100"></circle>
            <circle cx="300" cy="-173.2" r="100"></circle>
            <circle cx="300" cy="173.2" r="100"></circle>
            <circle cx="0" cy="346.4" r="100"></circle>
            <circle cx="-300" cy="173.2" r="100"></circle>
            <circle cx="-300" cy="-173.2" r="100"></circle>
            
            <!-- Connecting lines -->
            <line x1="0" y1="0" x2="0" y2="-173.2" stroke="#FF9933" opacity="0.3"></line>
            <line x1="0" y1="0" x2="150" y2="-86.6" stroke="#FF9933" opacity="0.3"></line>
            <line x1="0" y1="0" x2="150" y2="86.6" stroke="#FF9933" opacity="0.3"></line>
            <line x1="0" y1="0" x2="0" y2="173.2" stroke="#FF9933" opacity="0.3"></line>
            <line x1="0" y1="0" x2="-150" y2="86.6" stroke="#FF9933" opacity="0.3"></line>
            <line x1="0" y1="0" x2="-150" y2="-86.6" stroke="#FF9933" opacity="0.3"></line>
            
            <!-- Lotus symbol in center -->
            <path d="M0,-20 C30,-10 40,20 0,30 C-40,20 -30,-10 0,-20 Z" fill="#F77FBE" fill-opacity="0.2"></path>
            <path d="M0,-20 C30,-10 40,20 0,30 C-40,20 -30,-10 0,-20 Z" fill="#F77FBE" fill-opacity="0.2" transform="rotate(60)"></path>
            <path d="M0,-20 C30,-10 40,20 0,30 C-40,20 -30,-10 0,-20 Z" fill="#F77FBE" fill-opacity="0.2" transform="rotate(120)"></path>
            <path d="M0,-20 C30,-10 40,20 0,30 C-40,20 -30,-10 0,-20 Z" fill="#F77FBE" fill-opacity="0.2" transform="rotate(180)"></path>
            <path d="M0,-20 C30,-10 40,20 0,30 C-40,20 -30,-10 0,-20 Z" fill="#F77FBE" fill-opacity="0.2" transform="rotate(240)"></path>
            <path d="M0,-20 C30,-10 40,20 0,30 C-40,20 -30,-10 0,-20 Z" fill="#F77FBE" fill-opacity="0.2" transform="rotate(300)"></path>
        </g>
    </g>
</svg>
