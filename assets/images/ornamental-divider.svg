<?xml version="1.0" encoding="UTF-8"?>
<svg width="300px" height="30px" viewBox="0 0 300 30" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>Ornamental Divider</title>
    <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <!-- Center lotus -->
        <g transform="translate(150.000000, 15.000000)" fill="#0A6EB4" opacity="0.7">
            <circle cx="0" cy="0" r="5"></circle>
            <path d="M0,-10 C15,-5 20,10 0,15 C-20,10 -15,-5 0,-10 Z" opacity="0.5"></path>
            <path d="M0,-10 C15,-5 20,10 0,15 C-20,10 -15,-5 0,-10 Z" opacity="0.5" transform="rotate(60)"></path>
            <path d="M0,-10 C15,-5 20,10 0,15 C-20,10 -15,-5 0,-10 Z" opacity="0.5" transform="rotate(120)"></path>
            <path d="M0,-10 C15,-5 20,10 0,15 C-20,10 -15,-5 0,-10 Z" opacity="0.5" transform="rotate(180)"></path>
            <path d="M0,-10 C15,-5 20,10 0,15 C-20,10 -15,-5 0,-10 Z" opacity="0.5" transform="rotate(240)"></path>
            <path d="M0,-10 C15,-5 20,10 0,15 C-20,10 -15,-5 0,-10 Z" opacity="0.5" transform="rotate(300)"></path>
        </g>
        
        <!-- Left line with decorative elements -->
        <line x1="20" y1="15" x2="130" y2="15" stroke="#FF9933" stroke-width="1.5" opacity="0.7"></line>
        <circle cx="40" cy="15" r="3" fill="#FF9933" opacity="0.7"></circle>
        <circle cx="70" cy="15" r="3" fill="#FF9933" opacity="0.7"></circle>
        <circle cx="100" cy="15" r="3" fill="#FF9933" opacity="0.7"></circle>
        
        <!-- Right line with decorative elements -->
        <line x1="170" y1="15" x2="280" y2="15" stroke="#FF9933" stroke-width="1.5" opacity="0.7"></line>
        <circle cx="200" cy="15" r="3" fill="#FF9933" opacity="0.7"></circle>
        <circle cx="230" cy="15" r="3" fill="#FF9933" opacity="0.7"></circle>
        <circle cx="260" cy="15" r="3" fill="#FF9933" opacity="0.7"></circle>
    </g>
</svg>
