<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="circuit-pattern" patternUnits="userSpaceOnUse" width="200" height="200">
      <rect width="200" height="200" fill="none"/>
      <!-- Horizontal lines -->
      <path d="M0,50 L200,50" stroke="#4a90e2" stroke-width="0.5" stroke-opacity="0.2"/>
      <path d="M0,100 L200,100" stroke="#4a90e2" stroke-width="0.5" stroke-opacity="0.2"/>
      <path d="M0,150 L200,150" stroke="#4a90e2" stroke-width="0.5" stroke-opacity="0.2"/>
      
      <!-- Vertical lines -->
      <path d="M50,0 L50,200" stroke="#4a90e2" stroke-width="0.5" stroke-opacity="0.2"/>
      <path d="M100,0 L100,200" stroke="#4a90e2" stroke-width="0.5" stroke-opacity="0.2"/>
      <path d="M150,0 L150,200" stroke="#4a90e2" stroke-width="0.5" stroke-opacity="0.2"/>
      
      <!-- Circuit elements -->
      <circle cx="50" cy="50" r="3" fill="#4a90e2" fill-opacity="0.3"/>
      <circle cx="150" cy="50" r="3" fill="#4a90e2" fill-opacity="0.3"/>
      <circle cx="50" cy="150" r="3" fill="#4a90e2" fill-opacity="0.3"/>
      <circle cx="150" cy="150" r="3" fill="#4a90e2" fill-opacity="0.3"/>
      <circle cx="100" cy="100" r="3" fill="#4a90e2" fill-opacity="0.3"/>
      
      <!-- Circuit paths -->
      <path d="M50,50 L50,100 L100,100" stroke="#4a90e2" stroke-width="1" stroke-opacity="0.3"/>
      <path d="M150,50 L150,100 L100,100" stroke="#4a90e2" stroke-width="1" stroke-opacity="0.3"/>
      <path d="M50,150 L50,100" stroke="#4a90e2" stroke-width="1" stroke-opacity="0.3"/>
      <path d="M150,150 L150,100" stroke="#4a90e2" stroke-width="1" stroke-opacity="0.3"/>
      
      <!-- Circuit components -->
      <rect x="95" y="45" width="10" height="10" fill="#4a90e2" fill-opacity="0.3"/>
      <rect x="95" y="145" width="10" height="10" fill="#4a90e2" fill-opacity="0.3"/>
      <rect x="45" y="95" width="10" height="10" fill="#4a90e2" fill-opacity="0.3"/>
      <rect x="145" y="95" width="10" height="10" fill="#4a90e2" fill-opacity="0.3"/>
      
      <!-- Additional circuit elements -->
      <path d="M0,0 L25,25" stroke="#4a90e2" stroke-width="0.5" stroke-opacity="0.2"/>
      <path d="M175,175 L200,200" stroke="#4a90e2" stroke-width="0.5" stroke-opacity="0.2"/>
      <path d="M0,200 L25,175" stroke="#4a90e2" stroke-width="0.5" stroke-opacity="0.2"/>
      <path d="M175,25 L200,0" stroke="#4a90e2" stroke-width="0.5" stroke-opacity="0.2"/>
      
      <!-- Small nodes -->
      <circle cx="25" cy="25" r="1.5" fill="#4a90e2" fill-opacity="0.5"/>
      <circle cx="25" cy="75" r="1.5" fill="#4a90e2" fill-opacity="0.5"/>
      <circle cx="25" cy="125" r="1.5" fill="#4a90e2" fill-opacity="0.5"/>
      <circle cx="25" cy="175" r="1.5" fill="#4a90e2" fill-opacity="0.5"/>
      
      <circle cx="75" cy="25" r="1.5" fill="#4a90e2" fill-opacity="0.5"/>
      <circle cx="75" cy="75" r="1.5" fill="#4a90e2" fill-opacity="0.5"/>
      <circle cx="75" cy="125" r="1.5" fill="#4a90e2" fill-opacity="0.5"/>
      <circle cx="75" cy="175" r="1.5" fill="#4a90e2" fill-opacity="0.5"/>
      
      <circle cx="125" cy="25" r="1.5" fill="#4a90e2" fill-opacity="0.5"/>
      <circle cx="125" cy="75" r="1.5" fill="#4a90e2" fill-opacity="0.5"/>
      <circle cx="125" cy="125" r="1.5" fill="#4a90e2" fill-opacity="0.5"/>
      <circle cx="125" cy="175" r="1.5" fill="#4a90e2" fill-opacity="0.5"/>
      
      <circle cx="175" cy="25" r="1.5" fill="#4a90e2" fill-opacity="0.5"/>
      <circle cx="175" cy="75" r="1.5" fill="#4a90e2" fill-opacity="0.5"/>
      <circle cx="175" cy="125" r="1.5" fill="#4a90e2" fill-opacity="0.5"/>
      <circle cx="175" cy="175" r="1.5" fill="#4a90e2" fill-opacity="0.5"/>
    </pattern>
  </defs>
  
  <rect width="800" height="800" fill="url(#circuit-pattern)"/>
</svg>
